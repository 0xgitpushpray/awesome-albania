# Awesome Albania — the single source of truth.
# Both the website and README.md are generated from this file.
#
# Categories are "destinations". Each one lists its "via" stops (subcategories)
# in the order they should appear. Every resource names exactly one category
# and one of that category's stops.
#
# Resource fields:
#   name     required  Display name.
#   url      required  Canonical https URL.
#   desc     required  One sentence, no trailing marketing. Max ~140 chars.
#   cat      required  Category id.
#   via      required  One of the category's stops.
#   region   optional  al | xk | mk | me | global   (default: global)
#   tags     optional  Short lowercase keywords that help search.
#   license  optional  SPDX id or short text, when known.
#   archived optional  true when the project is unmaintained but still useful.

categories:
  - id: datasets
    name: Datasets
    sq: Të dhëna
    blurb: Corpora and labelled data with Albanian in them.
    via: [Text corpora, Parallel, Labelled, Speech, Indexes]

  - id: nlp
    name: Language & NLP
    sq: Gjuha
    blurb: Models and tools that read, write, speak or translate Albanian.
    via: [Models, Translation, Speech, Spelling & OCR, Libraries]

  - id: open-data
    name: Open Data
    sq: Të dhëna të hapura
    blurb: Official statistics, registers and public-sector data.
    via: [Portals, Statistics, Registers, Elections]

  - id: geo
    name: Maps & Geo
    sq: Harta
    blurb: Map data, boundaries and geospatial services.
    via: [OpenStreetMap, Geoportals, Extracts]

  - id: dev
    name: Developer Tools
    sq: Vegla
    blurb: Locale data, validators and the gotchas of building for the region.
    via: [Locale, Validation, Scripts & fonts, Gotchas]

  - id: l10n
    name: Localization
    sq: Përkthime
    blurb: Where Albanian translations of open-source software happen.
    via: [Platforms, Projects]

  - id: community
    name: Communities
    sq: Komuniteti
    blurb: People, hackerspaces, meetups and conferences.
    via: [Hackerspaces, Conferences, Meetups, Ecosystem]

  - id: learn
    name: Learning & Reference
    sq: Mësim
    blurb: Reading material and references for working in Albanian.
    via: [Encyclopedias, Dictionaries, Research]

