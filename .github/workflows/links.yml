name: Check links

# Weekly: re-check every resource URL, commit fresh "checked" dates,
# and open an issue listing anything that stopped responding.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: |
          set +e
          npm run check-links > link-report.txt 2>&1
          echo "failed=$?" >> "$GITHUB_OUTPUT"
          cat link-report.txt
      - name: Commit checked dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-status.json
          git diff --cached --quiet || git commit -m "chore: refresh link check dates"
          git push
      - name: Report dead links
        if: steps.check.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The weekly link check found resources that did not respond."
            echo
            echo '```'
            sed -n '/Unreachable:/,$p' link-report.txt
            echo '```'
            echo
            echo "Fix the URL, mark the entry \`archived: true\`, or remove it."
          } > body.md
          gh issue create --title "Dead links found ($(date +%Y-%m-%d))" --body-file body.md --label "dead link" || \
          gh issue create --title "Dead links found ($(date +%Y-%m-%d))" --body-file body.md
